version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: elib_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: elib
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - elib-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: elib_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - elib-network

  backend:
    build: ./backend
    container_name: elib_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://admin:password@db:5432/elb?schema=public"
      PORT: 5000
      volumes: -./backend:/app
        ./app/node_modeules

    depends_on:
      - db
    networks:
      - elib-network

  frontend:
    build: ./frontend
    container_name: elib_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - elib-network
volumes:
  pgdata:

networks:
  elib-network:
    driver: bridge
